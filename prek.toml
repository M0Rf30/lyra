[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    language = "system",
    entry = "cargo fmt --",
    files = "\\.rs$",
    stages = ["pre-commit"],
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    language = "system",
    entry = "cargo clippy --all-targets --all-features -- -D warnings",
    files = "\\.rs$",
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "cargo-check",
    name = "cargo check",
    language = "system",
    entry = "cargo check --all-targets --all-features",
    files = "\\.rs$",
    pass_filenames = false,
    stages = ["pre-commit"],
  },
]
