[package]
name = "lyra"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "A modern music player for the COSMIC desktop"
repository = "https://github.com/M0Rf30/lyra"

[dependencies]
# COSMIC / UI framework
# Pinned to a3cf875 to avoid FAMILY_MAP RwLock deadlock in ae830ca
# (perf(font): use RwLock) — it holds a read lock while unwrap_or_else
# tries to acquire a write lock on first font access.
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "a3cf875", features = [
    "about",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
    "wgpu",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Audio playback
rodio = { version = "0.21", features = ["symphonia-all"] }

# MPD protocol client
mpd_client = "1.4"

# OpenSubsonic/Subsonic API client
opensubsonic = { git = "https://github.com/M0Rf30/opensubsonic-rs.git" }

# Audio metadata (ID3, Vorbis, FLAC, etc.)
lofty = "0.23"

# Database for music library
rusqlite = { version = "0.38", features = ["bundled"] }

# Lyrics fetching
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image handling for cover art
image = "0.25"

# Internationalization
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"

# File system watching for library updates
notify = "8"

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
open = "5"
dirs = "6"
walkdir = "2"
chrono = "0.4"

# Optional: tokio-console support for runtime introspection
console-subscriber = { version = "0.5", optional = true }

# Optional: ProjectM visualizer (behind `visualizer` feature flag)
projectm = { version = "3.1", optional = true, default-features = false, features = ["static"] }
glutin = { version = "0.32", optional = true }
gl = { version = "0.14", optional = true }

[features]
default = []
tokio-console = ["dep:console-subscriber"]
visualizer = ["dep:projectm", "dep:glutin", "dep:gl"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "db_grouping"
harness = false

[profile.release]
lto = "thin"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
